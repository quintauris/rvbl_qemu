name: Build all machines

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    container:
      image: ghcr.io/quintauris-tech/rvbl-gcc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.QNT_PAT }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          repository: quintauris-tech/rvbl_internal
          submodules: recursive

    - name: Build tools
      uses: threeal/cmake-action@v2.1.0
      with:
        source-dir: quintauris_internal/tool
        build-dir: build/tool